# Stackage snapshot. LTS 23.28 ships GHC 9.8.4.
#
# Chosen over the newer LTS 24.x (GHC 9.10) deliberately: the servant/warp/blaze
# stack has more mileage on 9.8, and this project is currently built by CI rather
# than locally, so the lower-risk pairing is worth more than the newer compiler.
resolver: lts-23.28

packages:
- .
